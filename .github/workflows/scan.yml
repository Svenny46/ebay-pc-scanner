name: eBay deal scan

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

permissions:
  contents: write   # save data/seen.json so listings aren't re-checked
  issues: write     # open one issue per possible deal

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run scanner
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scanner.py
      - name: Save seen listings
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "Update seen listings"
          git pull --rebase --quiet && git push --quiet
